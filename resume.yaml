#
# Single source of truth for Arnav Mahadeshwar's resume.
# Spec: JSON Resume (https://jsonresume.org/schema/) + three extensions
# (all legal: the upstream schema sets additionalProperties: true)
#
#   work[].subsections : groups multiple projects under one employer, so a
#                        parser counts one job instead of three
#   engagements[]      : paid freelance / contract work, deliberately
#                        undated — see the block comment above that section
#   volunteer[]        : rendered INSIDE Experience, tagged
#                        "(Volunteer, Part-Time)", so there is no orphan
#                        one-item section on the page
#
# Build:  python build.py          -> dist/{index.html,ats.html,resume.json,*.txt}
# Verify: python build.py --check  (CI gate)  |  python build.py --links
# Deploy: git push                 (GitHub Actions -> GitHub Pages)
#
# House rules for editing this file (the pipeline renders whatever you put
# here — it cannot save you from a weak claim):
#   1. Every number must be defensible in a 45-minute interview.
#   2. Expand acronyms on first use. Keyword matchers are literal.
#   3. No self-assigned skill levels.
#   4. Outcomes, not activities. What changed for the business?
#   5. No square-bracket drafts. `--check` fails the build on them.
# ─────────────────────────────────────────────────────────────────────

