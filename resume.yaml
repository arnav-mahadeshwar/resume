# ─────────────────────────────────────────────────────────────────────
# ENGAGEMENTS — paid freelance / contract delivery.
#
# Why this section exists and why it has no dates:
#   Contract work is scoped by deliverable, not by tenure. A date range on a
#   3-month contract invites the wrong question ("why did it end?") instead
#   of the right one ("what did you ship, and is it still running?"). So each
#   entry answers the four things a hiring manager actually asks about
#   freelance work:
#     capacity  — who else was on it? (ownership / seniority signal)
#     mandate   — what problem were you hired to solve? (product judgement)
#     highlights— what did you build? (technical depth)
#     outcome   — is it live, and who depends on it? (finishing power)
#   `duration` and `status` carry scope and recency without a range.
#
# Field reference (all optional except client, role, highlights):
#   client, role, url, clientProfile, capacity, duration, status,
#   mandate, keywords, highlights, outcome
#
# To add another contract, copy the block below. Keep highlights to 4.
# ─────────────────────────────────────────────────────────────────────
engagements:
  - client: "MuddleArt Private Limited"
    role: "Full-Stack Engineer (Independent Contract)"
    clientProfile: >
      India's first formal, tech-enabled pre-consumer textile waste recycler,
      operating 6 factory units across Gujarat, Delhi, and Uttar Pradesh.
    capacity: "Sole engineer — architecture through production handover"
    duration: "3-month engagement"
    status: "Delivered; running in production"
    mandate: >
      Replace manual coordination with one system of record for daily material
      dispatch, multi-team approvals, and partner-facing impact reporting.
    keywords:
      - "Next.js"
      - "Google Apps Script"
      - "WhatsApp Business API"
      - "Tailwind CSS"
      - "TanStack Query"
      - "Chart.js"
    highlights:
      - >-
        Architected a serverless backend (Google Apps Script) with a webhook
        gateway, role-based dispatch engine, and scheduled cron jobs
        orchestrating daily logistics across 6 factory units, eliminating
        10+ hours/week of manual coordination
      - >-
        Integrated Meta WhatsApp Business API for interactive button-based
        approvals and template messaging across 4 operational teams (logistics,
        transport, bags, labour), processing 100+ messages per month
      - >-
        Built the Next.js partner portal (Tailwind CSS, TanStack Query,
        Chart.js) with a token-gated live dashboard, material breakdown, and
        collective impact tracking
      - >-
        Engineered a 3-stage data pipeline (Staging → Confirmation → Master
        Ledger) with nightly archival and automated environmental impact
        reporting (carbon dioxide avoided, water saved, employment generated)
    outcome: >
      Handed over documented and operational as the client's daily source of
      truth for dispatch, with the impact dashboard live for partners.

